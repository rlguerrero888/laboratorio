[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-ai-interview"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyspark>=3.5",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "spark: requires a JVM / PySpark session — run inside Docker",
    "integration: chains multiple stubs; only passes when all dependencies are implemented",
]
